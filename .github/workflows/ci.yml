name: CI  # For unit tests and build

on:
  push:
    branches:
      - '**'

env:
  USE_PYTHON_VERSION: "3.11"
  PROTO_DIR: "proto"

jobs:
  # Build meridian "core" and "mmm-proto-schema" distributions.
  build-distributions:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build meridian core distribution
        uses: ./.github/actions/build
        with:
          python_version: ${{ env.USE_PYTHON_VERSION }}
          artifact_name: meridian-core-package-distribution
      - name: Build mmm-proto-schema distribution
        uses: ./.github/actions/build
        with:
          python_version: ${{ env.USE_PYTHON_VERSION }}
          working_directory: ./proto
          output_path: ./proto/dist
          artifact_name: mmm-proto-package-distribution

  # Include for sanity checking that version increment parsing and checking logic works.
  check-version:
    name: Version check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # Check meridian version
      - uses: ./.github/actions/install-meridian
        with:
          python_version: ${{ env.USE_PYTHON_VERSION }}
          extras: ''

      - name: Get meridian version
        id: get_meridian_version
        shell: bash
        run: |
          VERSION=$(python -c "import meridian; print(meridian.__version__)")
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Check meridian version
        id: meridian_version_check
        uses: ./.github/actions/version-check
        with:
          python_version: ${{ env.USE_PYTHON_VERSION }}
          semver_prefix: v
          current_version: ${{ steps.get_meridian_version.outputs.value}}

      # Check mmm-proto-schema version
      - name: Get mmm-proto-schema version
        id: get_proto_version
        uses: ./.github/actions/get-proto-version
        with:
          python_version: ${{ env.USE_PYTHON_VERSION }}
      - name: Check mmm-proto-schema version
        uses: ./.github/actions/version-check
        with:
          python_version: ${{ env.USE_PYTHON_VERSION }}
          semver_prefix: proto-v
          current_version: ${{ steps.get_proto_version.outputs.value}}

  # Each test group runs in its own job, on its own runner. TensorFlow memory
  # builds up over a pytest run, so running the whole suite in one process ran
  # out of memory or time on the TensorFlow jobs. There's no `max-parallel`, so
  # all the jobs run at once.
  pytest-group:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Let the other groups finish when one fails, to show which groups pass.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        meridian-backend: ["tensorflow", "jax"]
        # `analysis` has the slowest tests, so it's a group of its own. The
        # other tests together take about as long.
        test-group:
          - name: analysis
            args: meridian/analysis
          # Keep the `--ignore`s in sync with the groups above, so that every
          # test runs exactly once.
          - name: other
            args: . --ignore=meridian/analysis
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.python-version }}-${{ matrix.meridian-backend }}-${{ matrix.test-group.name }}
      cancel-in-progress: true
    name: pytest group (python-${{ matrix.python-version }}, backend-${{ matrix.meridian-backend }}, ${{ matrix.test-group.name }})
    steps:
      - uses: actions/checkout@v6
        if: ${{ !contains(github.event.head_commit.message, '#skip-pytest') }}
      - uses: ./.github/actions/install-meridian
        if: ${{ !contains(github.event.head_commit.message, '#skip-pytest') }}
        with:
          python_version: ${{ matrix.python-version }}
      - name: Run core tests
        if: ${{ !contains(github.event.head_commit.message, '#skip-pytest') }}
        run: pytest -vv ${{ matrix.test-group.args }}
        env:
          MERIDIAN_BACKEND: ${{ matrix.meridian-backend }}

  # One job for each Python version and backend, with the names that Copybara
  # waits for (see `github_actions` in `copy.bara.sky`). Each runs after all the
  # test groups, even if some failed. GitHub gives one result for the whole
  # `pytest-group` matrix, so each passes only if every test group of every
  # Python version and backend passed. With `#skip-pytest`, the group jobs still
  # run and pass; only their steps are skipped.
  pytest:
    needs: pytest-group
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        meridian-backend: ["tensorflow", "jax"]
    name: pytest (python-${{ matrix.python-version }}, backend-${{ matrix.meridian-backend }})
    steps:
      - name: Check the test groups
        run: |
          if [ "${{ needs.pytest-group.result }}" != "success" ]; then
            echo "Not every test group passed (${{ needs.pytest-group.result }}). See the pytest group jobs."
            exit 1
          fi
